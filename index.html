<!DOCTYPE html>
<html lang="es" data-mode="estudio">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAGS · Diseñador de Jugadas</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">JAGS <span>flag 5v5 · IFAF</span></div>

    <div class="sideswitch" role="group" aria-label="Lado a diseñar">
      <button id="side-off" aria-pressed="true">Ofensiva</button>
      <button id="side-def" aria-pressed="false">Defensiva</button>
    </div>

    <div class="spacer"></div>

    <div class="tabs" role="tablist" aria-label="Superficie">
      <button class="tab" id="tab-design" role="tab" aria-selected="true">Diseñar</button>
      <button class="tab" id="tab-book" role="tab" aria-selected="false">Playbook</button>
      <button class="tab" id="tab-cancha" role="tab" aria-selected="false">Cancha</button>
    </div>

    <button class="btn ghost sm" id="mode-toggle" title="Modo de uso">Estudio</button>
  </header>

  <div class="main">

    <section class="stage" id="stage">
      <div class="toolbar">
        <div class="tgroup">
          <button class="btn ghost sm" id="t-route" aria-pressed="true">Ruta</button>
          <button class="btn ghost sm" id="t-motion" aria-pressed="false">Motion</button>
        </div>

        <div class="tgroup" id="formations">
          <button class="btn ghost sm" data-form="2x1" aria-pressed="true">2x1</button>
          <button class="btn ghost sm" data-form="bunch" aria-pressed="false">Racimo</button>
          <button class="btn ghost sm" data-form="trips" aria-pressed="false">Triple</button>
        </div>

        <button class="btn sm" id="b-mirror">Espejo</button>

        <div class="tgroup">
          <button class="btn ghost sm" id="t-zones" aria-pressed="true">Zonas</button>
          <button class="btn ghost sm" id="t-grid" aria-pressed="false">Cuadrícula</button>
          <button class="btn ghost sm" id="t-depths" aria-pressed="false">Profundidad</button>
          <button class="btn ghost sm" id="t-smooth" aria-pressed="false">Curvas</button>
        </div>

        <button class="btn sm" id="t-rival" aria-pressed="true">Ver rival</button>

        <div class="spacer"></div>
        <button class="btn sm" id="b-undo">Deshacer</button>
        <button class="btn sm" id="b-clear">Limpiar</button>
      </div>

      <div class="pieces" id="pieces" role="group" aria-label="Pieza seleccionada"></div>

      <div class="fieldwrap">
        <svg id="field" viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cancha de diseño"></svg>
        <p class="hint" id="hint"></p>
      </div>

      <div class="scrub">
        <button class="btn sm" id="b-play">Animar</button>
        <input type="range" id="scrubber" min="0" max="450" value="0" step="5" aria-label="Reloj de la jugada">
        <span class="clock" id="clock">estático</span>
      </div>
    </section>

    <aside class="side" id="side"></aside>
    <section class="surface" id="book" hidden></section>
    <section class="surface" id="cancha" hidden></section>
  </div>
</div>

<!-- Versionado de módulos.
     GitHub Pages sirve los assets con max-age=600, y cada archivo vence en
     su propio momento: un módulo nuevo junto a uno viejo no queda
     "desactualizado", revienta con un error de export. El import map fija
     la MISMA versión para todos, así que o carga todo nuevo o todo viejo.
     Al publicar cambios de código, subí APP_V. -->
<script>
  window.APP_V = '2026-09-04a';
  (function () {
    var base = new URL('.', location.href).href;
    var mods = ['js/app.js', 'js/model.js', 'js/field.js', 'js/draw.js', 'js/sim.js',
                'js/store.js', 'js/print.js', 'js/ui/book.js', 'js/ui/cancha.js'];
    var map = { imports: {} };
    mods.forEach(function (m) { map.imports[base + m] = base + m + '?v=' + window.APP_V; });
    var im = document.createElement('script');
    im.type = 'importmap';
    im.textContent = JSON.stringify(map);
    document.head.appendChild(im);
    var entry = document.createElement('script');
    entry.type = 'module';
    entry.src = base + 'js/app.js?v=' + window.APP_V;
    document.head.appendChild(entry);
  })();
</script>
</body>
</html>
